# /etc/sa02m_userspace_watchdog.conf — переопределение sa02m-userspace-watchdog
# FAIL_THRESHOLD × CHECK_INTERVAL = время до forced reboot при стойком сбое.
FAIL_THRESHOLD=60
CHECK_INTERVAL=10
IMAGING_LOCK=/run/sa02m-imaging.lock

# Проверка слоя CGI (auth_check.cgi) только лечит: после CGI_RESTART_AT подряд
# неудач перезапускается fcgiwrap, плата по ней НЕ перезагружается никогда.
# Таймаут пробы (занятый пул) лечится только после CGI_BUSY_RESTART_AT подряд.
# CGI_RESTART_AT=6
# CGI_BUSY_RESTART_AT=90

# Критичные процессы (на плате может быть mplc_daemon):
# REQUIRED_PROCS="mplc_daemon nginx sshd"

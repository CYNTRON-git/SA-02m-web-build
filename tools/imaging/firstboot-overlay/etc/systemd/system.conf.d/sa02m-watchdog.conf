# SA-02m hardware watchdog policy
# ─────────────────────────────────────────────────────────────────────────────
# Drop-in для /etc/systemd/system.conf — устанавливается в
# /etc/systemd/system.conf.d/sa02m-watchdog.conf
#
# Единственный дом политики — etc/systemd/sa02m-watchdog.conf в репозитории.
# Копии, которые обязаны существовать (установка по stdin без репо, imaging с
# USB-носителя), закреплены гейтом .ai-dev/quality/checks/watchdog-cap.sh —
# не правьте их в отрыве от эталона.
#
# RuntimeWatchdogSec=15s
#   PID1 systemd сам открывает /dev/watchdog и пингует его раз в ~8 c.
#   Sunxi A40i (sun4i-wdt) hardware cap = 16s:
#     sunxi-wdt 1c20c90.watchdog: Watchdog enabled (timeout=16 sec, nowayout=0)
#   На systemd, который стоит на плате (Debian bullseye), запрос выше кэпа не
#   клампится, а отвергается: "Failed to set timeout to ...: Invalid argument"
#   (EINVAL) — наблюдалось на устройстве. Значение обязано быть ≤16s.
#   15s — безопасно ниже кэпа и даёт udev-скрипту sa02m-i2c2-unbind.sh ≥7 c
#   запаса для отвязки i2c-2 до срабатывания.
#
# RebootWatchdogSec=16s
#   Сторож на время перезагрузки ВЗВЕДЁН на максимум драйвера (16 c; 2min
#   отвергался с EINVAL — BUGLOG 2026-08-05, гейт watchdog-cap).
#   Почему это безопасно для нормального выключения: systemd взводит этот
#   сторож только внутри systemd-shutdown — после того, как все юниты уже
#   остановлены, так что DefaultTimeoutStopSec и TimeoutStopSec служб с ним не
#   соревнуются; финальная фаза (размонтирование, sync, «Rebooting.») на
#   стенде 136 заняла 0.35 c (2026-10-21). Версия 2026-08-05 «медленное
#   выключение обрывается сторожем» осталась неподтверждённой гипотезой —
#   запись BUGLOG сама это оговаривает; подтверждённым дефектом был только
#   EINVAL на значении выше кэпа.
#   Зачем: программная перезагрузка зависала уже в ядре (device_shutdown после
#   «Rebooting.»), а с RebootWatchdogSec=0 PID1 разоружал сторож magic close
#   на всё время перезагрузки — плата висела до ручного сброса питания.
#   Вторая половина исправления — параметр ядра watchdog.stop_on_reboot=0 в
#   boot.scr (etc/boot.cmd.sa02m.min): без него ядро само останавливает
#   сторож в kernel_restart_prepare(), ещё до device_shutdown. Вместе они
#   превращают зависшую перезагрузку в самосброс за ≤16 c; нормальную
#   перезагрузку они не меняют. Факты и трассы —
#   .ai-dev/notes/reboot-hang-2026-10-21.md, запись BUGLOG 2026-10-21.
#
# ShutdownWatchdogSec — НЕ добавлять: устаревший (до systemd v243) псевдоним
#   RebootWatchdogSec, в текущем systemd-system.conf(5) не документирован.
#   Две ручки на одну политику — источник расхождения.
#
# Эти настройки делают пользовательский bash-watchdog-feeder ненужным:
# его старая реализация открывала /dev/watchdog в цикле, забивая journald
# спамом "watchdog: watchdog0: watchdog did not stop!".
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=16s

name: build-sa02m-kernel

# Собирает ядро SA-02м на базе wirenboard/linux + kernel-port/ оверлея.
# Матрица: SMP (sa02m) и PREEMPT_RT (sa02m-rt). Артефакты — zImage, DTB и
# полный набор .deb (linux-image, linux-headers, linux-libc-dev).
#
# Триггеры:
#   push в main/cursor/*: полная сборка обеих flavour + .deb
#   pull_request на main: только smoke build (zImage + DTB без .deb)
#   workflow_dispatch: ручной запуск с выбором flavour

on:
  push:
    branches:
      - main
      - "cursor/*"
    paths:
      - "kernel-port/**"
      - "tools/kernel-wb/**"
      - ".github/workflows/build-sa02m-kernel.yml"
  pull_request:
    branches: [main]
    paths:
      - "kernel-port/**"
      - "tools/kernel-wb/**"
      - ".github/workflows/build-sa02m-kernel.yml"
  workflow_dispatch:
    inputs:
      flavour:
        description: "Kernel flavour to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - sa02m
          - sa02m-rt
      smoke_only:
        description: "Skip .deb, build only zImage+dtbs"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-sa02m-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke build (${{ matrix.flavour }})
    if: github.event_name == 'pull_request' || github.event.inputs.smoke_only == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavour: [sa02m, sa02m-rt]
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-toolchain and build deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc-arm-linux-gnueabihf bc kmod cpio fakeroot dpkg-dev \
            flex bison libssl-dev libelf-dev quilt rsync

      - name: Cache wirenboard/linux checkout
        uses: actions/cache@v4
        with:
          path: ~/build/sa02m-kernel/wb-linux
          key: wb-linux-2606-wb7-bullseye-${{ hashFiles('kernel-port/patches/*.patch') }}
          restore-keys: |
            wb-linux-2606-wb7-bullseye-

      - name: Smoke build ${{ matrix.flavour }}
        run: |
          ./tools/kernel-wb/build-sa02m-kernel.sh ${{ matrix.flavour }} --smoke

      - name: Upload zImage/DTB
        uses: actions/upload-artifact@v4
        with:
          name: sa02m-kernel-${{ matrix.flavour }}-smoke
          path: |
            ~/build/sa02m-kernel/wb-linux/arch/arm/boot/zImage
            ~/build/sa02m-kernel/wb-linux/arch/arm/boot/dts/sun8i-r40-sa02m.dtb
            ~/build/sa02m-kernel/wb-linux/.config
          if-no-files-found: error
          retention-days: 14

  build-deb:
    name: build .deb (${{ matrix.flavour }})
    if: github.event_name != 'pull_request' && github.event.inputs.smoke_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavour: ${{ github.event.inputs.flavour == 'sa02m' && fromJSON('["sa02m"]') || (github.event.inputs.flavour == 'sa02m-rt' && fromJSON('["sa02m-rt"]') || fromJSON('["sa02m", "sa02m-rt"]')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-toolchain and build deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc-arm-linux-gnueabihf bc kmod cpio fakeroot dpkg-dev \
            flex bison libssl-dev libelf-dev quilt rsync

      - name: Cache wirenboard/linux checkout
        uses: actions/cache@v4
        with:
          path: ~/build/sa02m-kernel/wb-linux
          key: wb-linux-2606-wb7-bullseye-${{ hashFiles('kernel-port/patches/*.patch') }}
          restore-keys: |
            wb-linux-2606-wb7-bullseye-

      - name: Build ${{ matrix.flavour }} .deb
        run: |
          ./tools/kernel-wb/build-sa02m-kernel.sh ${{ matrix.flavour }}

      - name: Upload .deb artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sa02m-kernel-${{ matrix.flavour }}-deb
          path: ~/build/sa02m-kernel/*.deb
          if-no-files-found: error
          retention-days: 30

name: web-quality

# Runs the project quality registry (.ai-dev/quality/tools.json) in CI so a PR
# to main is gated on the same checks the Builder/Reviewer run locally.
# The registry is the one home for the row list — this workflow invokes the
# runner wholesale (both beats) and never re-lists individual tools.
# ubuntu-latest already provides bash + python3; only Node needs setting up.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build-beat gate (full registry, build beat)
        run: node .ai-dev/quality/run.mjs build
      - name: Review-beat gate (full registry, review beat)
        run: node .ai-dev/quality/run.mjs review

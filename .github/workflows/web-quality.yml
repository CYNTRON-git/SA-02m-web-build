name: web-quality

# Runs the project quality registry (.ai-dev/quality/tools.json) in CI so a PR
# to main is gated on the same checks the Builder/Reviewer run locally.
# The registry is the one home for the row list — this workflow invokes the
# runner wholesale (both beats) and never re-lists individual tools.
# ubuntu-latest already provides bash + python3; Node, the Python test deps and
# — since 1.0.6.49 — the scripts/dev Playwright harness + chromium are set up
# here, so the headless review rows (ui-layout, cloud-card-smoke,
# sh-modal-layout-smoke, homekit-card-smoke) run for real instead of skipping or
# exiting 2 (audit 2026-09-16, H3). Since 1.0.6.57 a venv built from
# opt/sa02m-homekit/requirements.lock makes py-unit-homekit's HAP-python/segno
# tests run instead of skipping.

# push->main deliberately absent: each shipped feature otherwise costs two
# identical runs (PR + post-squash re-validation of the same tree) against a
# tight Actions budget — rationale and measurements: .ai-dev/notes/ci-budget.md.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python test deps (make the py-unit-* pytest rows real, not skipped)
        run: python3 -m pip install --quiet pytest pyserial pyyaml cryptography jsonschema
      # The board's own install contract (docs/decisions/homekit-home-connect.md
      # G1): system python3 + apt python3-cffi-backend, venv with
      # --system-site-packages, `pip install --no-deps` from the hash-pinned
      # lock. The lock's x86_64 wheels are cp312, so a runner image whose
      # python3 is not 3.12 FAILS this step by name instead of skipping tests.
      - name: HomeKit test venv from the lock (py-unit-homekit runs the pyhap/segno tests, not skips)
        run: |
          /usr/bin/python3 -c 'import sys; v = sys.version_info[:2]; sys.exit(0 if v == (3, 12) else "requirements.lock x86_64 wheels are cp312; runner python3 is %d.%d" % v)'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-venv python3-cffi-backend
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/hk-venv"
          "$RUNNER_TEMP/hk-venv/bin/pip" install --quiet --no-deps -r opt/sa02m-homekit/requirements.lock
          "$RUNNER_TEMP/hk-venv/bin/python" -c 'import pyhap.accessory_driver, segno'
          echo "SA02M_HOMEKIT_TEST_PY=$RUNNER_TEMP/hk-venv/bin/python" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers (review-beat chromium; ci-budget.md)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/dev/package-lock.json') }}
      # `npm ci` (lockfile-exact) instead of the root `ui-layout:install` script's
      # `npm install`: CI must run the pinned harness, the dev box may float.
      # `--with-deps` adds the Ubuntu shared libs chromium needs (runner sudo).
      - name: Install the dev harness + chromium (the headless rows — ui-layout, cloud-card-smoke, sh-modal-layout-smoke, homekit-card-smoke)
        run: |
          npm --prefix scripts/dev ci
          node scripts/dev/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build-beat gate (full registry, build beat)
        run: node .ai-dev/quality/run.mjs build
      - name: Review-beat gate (full registry, review beat)
        run: node .ai-dev/quality/run.mjs review

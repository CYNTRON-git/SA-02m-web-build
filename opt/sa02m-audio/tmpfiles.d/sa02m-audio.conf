# SA-02m audio recorder dirs (docs/contracts/audio-recorder.md §Файлы и права).
# systemd-tmpfiles re-asserts owner/mode on existing dirs every boot — the
# idempotent migration for in-place upgrades. Installed into /etc/tmpfiles.d/
# ONLY by the module's installer step: the lines name the sa02m-audio account,
# which exists only where that step ran (an OTA lands this copy inert under /opt).
#
# eMMC store + events.jsonl: the daemon writes, the panel CGI (www-data) reads
# through the group; setgid, so every file created here is group www-data — the
# daemon is NOT in that group. rec/ the same; tmp/ (the .part files) is the
# daemon's alone.
d /var/lib/sa02m-audio 2750 sa02m-audio www-data -
d /var/lib/sa02m-audio/rec 2750 sa02m-audio www-data -
d /var/lib/sa02m-audio/tmp 0700 sa02m-audio sa02m-audio -
# status.json + daemon.lock: the daemon writes, the CGI reads through the group.
d /run/sa02m-audio 2750 sa02m-audio www-data -
# Conf dir: www-data owns it (the CGI saves the conf atomically — tmp file +
# rename), setgid group sa02m-audio, so the daemon reads it and never writes.
d /etc/sa02m-audio 2750 www-data sa02m-audio -

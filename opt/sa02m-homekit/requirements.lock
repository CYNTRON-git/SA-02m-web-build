# sa02m-homekit venv lock: the COMPLETE closure, hash-pinned, wheels only.
# Why these versions, the evidence, and the install contract:
# docs/decisions/homekit-home-connect.md (G1). Install ONLY as
#   python3 -m venv --system-site-packages /opt/sa02m-homekit-venv
#   /opt/sa02m-homekit-venv/bin/pip install --no-deps -r requirements.lock
# --no-deps is required: cryptography declares cffi>=2.0.0, PyPI has no
# armv7l cffi wheel, and the runtime needs only the C module _cffi_backend
# from apt python3-cffi-backend. Without --no-deps pip fails closed.
# Each hash line: manylinux armv7l (the board) and, where the wheel is not
# pure Python, manylinux x86_64 (CI / dev hosts).

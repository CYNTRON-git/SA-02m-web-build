# SA-02m Apple HomeKit bridge dirs (docs/contracts/homekit-bridge.md, files and
# permissions). systemd-tmpfiles re-asserts owner/mode on existing dirs every
# boot — the idempotent migration for in-place upgrades.
#
# Pairing store (HAP long-term keys, pairings, AID map, machine-id binding):
# the unprivileged daemon user ONLY — never www-data (promise P4). Contents
# are wiped at the imaging sites (docs/contracts/image-identity-reset.md), the
# dir itself stays.
d /var/lib/sa02m-homekit 0700 sa02m-homekit sa02m-homekit -
# status.json (0644), projection.json + setup.json (0640, group www-data): the
# daemon writes, the CGI (www-data) reads through the group. setup.json exists
# only while the bridge runs unpaired.
d /run/sa02m-homekit 0750 sa02m-homekit www-data -
# Conf dir needs group write: the CGI (www-data) saves the conf atomically
# (tmp file + rename), which requires write on the directory.
d /etc/sa02m-homekit 0770 root www-data -

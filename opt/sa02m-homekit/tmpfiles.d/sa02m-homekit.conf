# SA-02m Apple HomeKit bridge dirs (docs/contracts/homekit-bridge.md, files and
# permissions). systemd-tmpfiles re-asserts owner/mode on existing dirs every
# boot — the idempotent migration for in-place upgrades.
#
# Pairing store (HAP long-term keys, pairings, AID map, machine-id binding):
# the unprivileged daemon user ONLY — never www-data (promise P4). Contents
# are wiped at the imaging sites (docs/contracts/image-identity-reset.md), the
# dir itself stays.
d /var/lib/sa02m-homekit 0700 sa02m-homekit sa02m-homekit -
# status.json (0644), projection.json + setup.json (0640, group www-data): the
# daemon writes, the CGI (www-data) reads through the group. setgid: every
# file created here inherits group www-data — the daemon is NOT in that group
# (it would read the panel credentials; gate `daemon-least-privilege`).
# setup.json exists only while the bridge runs unpaired.
d /run/sa02m-homekit 2750 sa02m-homekit www-data -
# Conf dir needs group write: the CGI (www-data) saves the conf atomically
# (tmp file + rename), which requires write on the directory.
d /etc/sa02m-homekit 0770 root www-data -
# Read for the daemon, by ACL: traverse on the two directories it reads from,
# a DEFAULT read entry so every file created there — the tmp file an atomic
# rename turns into the conf / device document — carries the grant (a per-file
# ACL dies with the old inode), and read on the files that already exist
# (created before the default ACL). default:mask::rwx keeps a new file's group
# bits what its creator asked for. The Alice dir holds only non-secret confs.
a+ /etc/sa02m-homekit - - - - user:sa02m-homekit:--x,default:user:sa02m-homekit:r--,default:mask::rwx
a+ /etc/sa02m-homekit/sa02m-homekit.conf - - - - user:sa02m-homekit:r--
a+ /etc/sa02m-alice - - - - user:sa02m-homekit:--x,default:user:sa02m-homekit:r--,default:mask::rwx
a+ /etc/sa02m-alice/sa02m-alice-devices.conf - - - - user:sa02m-homekit:r--

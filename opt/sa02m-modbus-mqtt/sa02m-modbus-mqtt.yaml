# SA-02m — Modbus→MQTT bridge configuration
# Этот файл управляется через веб-интерфейс (вкладка «MQTT»).
# Редактировать вручную можно, затем перезапустить: systemctl restart sa02m-modbus-mqtt

mqtt:
  broker: 127.0.0.1
  port: 1883
  client_id: sa02m-modbus-bridge
  qos: 1
  retain: true
  reconnect_delay_s: 5
  # Опрос RS-485: непрерывный round-robin на каждом COM (без port_poll_s / пауз)
  # username: mqttuser        # опционально (если broker требует авторизацию)
  # password: ""
  # ── Доступность (в стиле wb-mqtt-serial) ──────────────────────────────────
  # availability: true        # LWT + device-level /meta/error + статус-устройство моста
  # bridge_device_id: sa02m-bridge   # id устройства-статуса моста в /devices/<id>

# Параметры доступности по умолчанию для каждого устройства (можно
# переопределить внутри конкретного устройства):
#   offline_after_fails: 3    # подряд неуспешных чтений → устройство offline (meta/error="r")
#   backoff_base_s: 2.0       # стартовая пауза опроса «мёртвого» устройства
#   backoff_max_s: 30.0       # максимальная пауза (чтобы не нагружать half-duplex шину)

devices:
  # ── Пример: MR-02м DO6DI8, COM1, addr=5 ─────────────────────────────────
  # - id: mr02m-COM1-5
  #   type: mr02m
  #   module_type: 1        # ОБЯЗАТЕЛЬНО: тип модуля (1=DO6DI8, 6=AO6AI6, 8=DO4DI6 и т.д.)
  #                         # Используется веб-UI для отображения каналов; мост авто-определяет
  #                         # тип через FC04 при старте, но module_type нужен для корректного UI
  #   port: /dev/COM1
  #   baudrate: 115200
  #   address: 5
  #   name: "MR-02m DO6DI8 (COM1 addr=5)"
  #   # fast_modbus: true   # включить Wiren Board Fast Modbus events (мгновенный DO/DI)
  #   poll_s: 1              # полный опрос DO/DI + AO/AI (с); poll_do_di_s/poll_ai_ao_s — устар., синхронизируются с poll_s
  #   poll_diag_s: 60
  #   offline_after_fails: 3    # доступность: после N неответов → offline + backoff
  #   backoff_base_s: 2.0
  #   backoff_max_s: 30.0
  #   channels:
  #     do:
  #       - {ch: 1, label: "Выход 1", enabled: true}
  #       - {ch: 2, label: "Выход 2", enabled: true}
  #       - {ch: 3, label: "Выход 3", enabled: true}
  #       - {ch: 4, label: "Выход 4", enabled: true}
  #       - {ch: 5, label: "Выход 5", enabled: true}
  #       - {ch: 6, label: "Выход 6", enabled: true}
  #     di:
  #       - {ch: 1, label: "Вход 1", enabled: true, counter: true}
  #       - {ch: 2, label: "Вход 2", enabled: true, counter: true}
  #       - {ch: 3, label: "Вход 3", enabled: true, counter: false}
  #       - {ch: 4, label: "Вход 4", enabled: true, counter: false}
  #       - {ch: 5, label: "Вход 5", enabled: true, counter: false}
  #       - {ch: 6, label: "Вход 6", enabled: true, counter: false}
  #       - {ch: 7, label: "Вход 7", enabled: true, counter: false}
  #       - {ch: 8, label: "Вход 8", enabled: true, counter: false}

  # ── Пример: cyntron-dtv RTU-Sensor, COM3, addr=1 ─────────────────────────
  # - id: dtv-COM3-1
  #   type: dtv
  #   port: /dev/COM3
  #   baudrate: 19200
  #   address: 1
  #   name: "DTV-RS-485 (COM3 addr=1)"
  #   poll_sensors_s: 10
  #   poll_presence_s: 2
  #   poll_diag_s: 60
  #   sensors_present:
  #     - temp_ds18b20
  #     - temp_bme680
  #     - humidity_bme680
  #     - pressure_bme680_kpa
  #     - iaq_bme680
  #     - eco2_bme680
  #     - tvoc_zmod
  #     - presence
  #     - moving_distance

  # ── Пример: CE-02m-3, COM2, addr=14 ─────────────────────────────────────
  # - id: ce02m3-COM2-14
  #   type: ce02m3
  #   port: /dev/COM2
  #   baudrate: 115200
  #   address: 14
  #   name: "CE-02m-3 (COM2 addr=14)"
  #   poll_power_s: 5
  #   poll_energy_s: 60
  #   poll_diag_s: 120
  #   ct_ratio: 4000
  #   phases: [A, B, C]
  #   publish_per_phase_energy: false
  #   channels_enabled:
  #     voltages: true
  #     line_voltages: true
  #     currents: true
  #     power_active: true
  #     power_reactive: true
  #     power_apparent: false
  #     power_factor: true
  #     frequency: true
  #     energy: true

  # ── Пример: MR-02m 6AI6AO COM4 addr=6 ───────────────────────────────────
  # 6AO6AI6: AI2/4/6 — N-нога пары; тип датчика как у AI1/3/5 (в веб-UI синхронизируется).
  # RTD/NTC: N в MQTT обычно enabled: false; ТХА (код 6): AI5 и AI6 оба enabled.
  # - id: mr02m-COM4-6
  #   module_type: 6
  #   port: /dev/COM4
  #   address: 6
  #   channels:
  #     ai:
  #       - {ch: 1, sensor_type: 1, enabled: true}
  #       - {ch: 2, sensor_type: 1, enabled: false}
  #       - {ch: 3, sensor_type: 28, enabled: true}
  #       - {ch: 4, sensor_type: 28, enabled: false}
  #       - {ch: 5, sensor_type: 6, enabled: true}
  #       - {ch: 6, sensor_type: 6, enabled: true}

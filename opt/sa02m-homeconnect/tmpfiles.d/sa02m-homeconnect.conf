# SA-02m Home Connect client dirs (docs/contracts/home-connect.md §11).
# systemd-tmpfiles re-asserts owner/mode on existing dirs every boot — the
# idempotent migration for in-place upgrades. Installed into /etc/tmpfiles.d/
# ONLY by scripts/06d-homeconnect.sh: the lines name the sa02m-homeconnect
# account, which exists only where that module ran (an OTA lands this copy
# inert under /opt).
#
# OAuth tokens, the daily call budget, the published-appliance list: the
# unprivileged daemon user ONLY — never www-data (promise P4). Contents are
# wiped by factory reset and at the imaging sites
# (docs/contracts/image-identity-reset.md §8); the dir itself stays.
d /var/lib/sa02m-homeconnect 0700 sa02m-homeconnect sa02m-homeconnect -
# status.json (0644), link.json + inventory.json (0640, group www-data): the
# daemon writes, the CGI (www-data) reads through the group. setgid: every
# file created here inherits group www-data — the daemon is NOT in that group
# (gate `daemon-least-privilege`). link.json exists only while a sign-in waits
# for the user.
d /run/sa02m-homeconnect 2750 sa02m-homeconnect www-data -
# Conf dir: www-data owns it (the CGI saves the conf atomically — tmp file +
# rename — which needs write on the directory), setgid group sa02m-homeconnect,
# so every file created here is the daemon's group; the daemon gets traverse +
# read, never write. The conf is www-data:sa02m-homeconnect 0640 — a plain
# group, no ACL (the product RT kernel has none, bench 1.135); its
# owner/group/mode are re-asserted, and the access PROVEN as the daemon, by
# usr/local/sbin/sa02m-daemon-access.sh (the installer's last step and the
# unit's ExecStartPre).
d /etc/sa02m-homeconnect 2750 www-data sa02m-homeconnect -

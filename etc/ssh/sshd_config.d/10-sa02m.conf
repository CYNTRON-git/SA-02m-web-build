# ═══════════════════════════════════════════════════════════════════════════
# /etc/ssh/sshd_config.d/10-sa02m.conf
# SA-02m SSH hardening: keepalive, faster session timeouts, no DNS.
# Этот drop-in загружается после основного sshd_config и переопределяет
# только нужные параметры.
# ═══════════════════════════════════════════════════════════════════════════

# Сервер шлёт keepalive каждые 15 с и закрывает сессию через 4×15=60 с тишины.
# Это лечит "висящие" сессии после кратковременного пропадания линка.
ClientAliveInterval 15
ClientAliveCountMax 4

# Уровень TCP — дополнительно к application-level keepalive выше.
TCPKeepAlive yes

# DNS на изолированной сети может не работать — выключаем reverse-lookup,
# иначе sshd зависает на 10-30 с при подключении до auth.
UseDNS no
GSSAPIAuthentication no

# Ограничение времени на ввод пароля/ключа после TCP-connect.
LoginGraceTime 30

# Поднимаем лимит одновременно открывающихся соединений (важно если
# сразу несколько клиентов делают reconnect после сбоя сети).
MaxStartups 30:30:100
MaxSessions 10

# Запрет parm-auth — у нас только ключи. (Если потребуется пароль —
# закомментируйте строку и используйте root cyntron.)
# PasswordAuthentication no

# Кэшировать соединение клиента (нам полезно при ControlMaster).
# Серверная часть — параметр LoginGraceTime достаточно.

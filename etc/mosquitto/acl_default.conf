# SA-02m — Mosquitto ACL (шаблон)
# Устанавливается в /etc/mosquitto/acl/default.conf

# Пользователь mqttuser — доступ с ПК (порт 1884).
# Топики моста: /devices/… (Wiren Board) — обязателен ведущий «/».
user mqttuser
# Audio recorder (docs/contracts/audio-recorder.md §20): no direct command
# from the external listener — the filter covers every recorder command
# topic (record/on, delete/on, light_music/on). A `topic deny` inside this
# user's block — a `pattern deny` is NOT applied to a user that has a grant
# (mosquitto 2.0.18, measured on bench 1.135, 2026-10-15). scripts/15-audio.sh
# adds this exact line to an already-installed ACL.
topic deny /devices/sa02m-audio/controls/+/on
topic readwrite /devices/#
topic read $SYS/#

# SA-02m Mosquitto broker listeners
# per_listener_settings true is required in mosquitto 2.0 for per-listener auth.
# Without it, allow_anonymous after listener directives is ignored (global auth only).

per_listener_settings true

# Port 1883 - localhost only, anonymous (MPLC4, Python bridge, CGI)
listener 1883 127.0.0.1
allow_anonymous true

# Port 1884 - external with authentication (SCADA, Node-RED, clients)
listener 1884
allow_anonymous false
password_file /etc/mosquitto/passwd/default.conf
acl_file /etc/mosquitto/acl/default.conf

# SYS topics update interval (seconds) - used by web dashboard widget
sys_interval 30

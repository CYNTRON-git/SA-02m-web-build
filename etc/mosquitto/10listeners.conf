# SA-02m — Mosquitto broker listeners
# Устанавливается в /etc/mosquitto/conf.d/10listeners.conf

# ── Локальный порт (MPLC4, Python-мост, CGI) ───────────────────────────────
# Только loopback — без аутентификации, внешний доступ закрыт.
listener 1883 127.0.0.1
allow_anonymous true

# ── Внешний порт (SCADA, Node-RED, клиенты) ────────────────────────────────
# Все интерфейсы — требует логина/пароля.
listener 1884
allow_anonymous false
password_file /etc/mosquitto/passwd/default.conf
acl_file /etc/mosquitto/acl/default.conf

# ── Системные топики брокера ($SYS) ────────────────────────────────────────
# Обновление каждые 30 секунд; нужны для виджета MQTT в веб-интерфейсе.
sys_interval 30

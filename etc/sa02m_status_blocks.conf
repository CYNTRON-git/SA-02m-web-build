# Управление блоками опроса для web dashboard.
# 1 = включено, 0 = отключено.
# Используйте /usr/local/sbin/sa02m-status-blocks-guard для безопасного
# включения блоков с автооткатом, если SSH/Web начинают деградировать.

# Storage виджет и размер накопителей должны работать по умолчанию.
SA02M_STATUS_ENABLE_STORAGE=1
SA02M_STATUS_ENABLE_TIME=0
SA02M_STATUS_ENABLE_UPTIME=1
SA02M_STATUS_ENABLE_NETWORK=1
SA02M_STATUS_ENABLE_LOAD=1
SA02M_STATUS_ENABLE_SYSTEM=1
SA02M_STATUS_ENABLE_SERVICES=1
SA02M_STATUS_ENABLE_HARDWARE=0
SA02M_STATUS_ENABLE_RS485=1

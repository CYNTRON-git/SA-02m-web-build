server {
    # default_server — при втором vhost на том же порту отвечает этот блок (иначе 403 из «чужого» root)
    listen __PORT__ default_server;
    # __SA02M_SSL__ (03-webserver.sh подставляет listen 443 ssl + сертификат, если он создан)
    server_name _;
    root __WEB_ROOT__;
    index index.html;

    charset utf-8;

    # ── Static assets (CSS, JS, images) ────────────────────────────────────
    location /static/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Login page (no auth) ────────────────────────────────────────────────
    location = /login.html { try_files $uri =404; }

    # Старые закладки /cgi-bin/index.cgi — без fcgiwrap (устраняет 403 если файла нет или не +x)
    location = /cgi-bin/index.cgi {
        return 302 /;
    }

    # ── CGI backend ─────────────────────────────────────────────────────────
    # Долгая диагностика (i2cdetect, journalctl, много секций) — общий таймаут 20s обрывает ответ.
    location = /cgi-bin/ssh_debug.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    120s;
        fastcgi_read_timeout    120s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # web_update_check.cgi?force=1: git ls-remote + GitHub API до ~36s → общий 20s даёт 504.
    location = /cgi-bin/web_update_check.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # services_ctrl.cgi GET: list опрашивает systemd по каждой службе; при параллельном stop/start
    # (CODESYS и др.) systemctl может отвечать >20s → 504 во время poll в UI.
    location = /cgi-bin/services_ctrl.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    120s;
        fastcgi_read_timeout    120s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # apply.cgi: timedatectl/hwclock при сбое dbus могут не отвечать дольше общего 20s → 504.
    location = /cgi-bin/apply.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    120s;
        fastcgi_read_timeout    120s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # mqtt_monitor.cgi: SSE stream — buffering off, long timeout required
    location = /cgi-bin/mqtt_monitor.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout    300s;
        fastcgi_read_timeout    300s;
        fastcgi_buffering       off;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }

    # include первым: дистрибутивный fastcgi_params не должен перетирать наши значения «сверху»
    location /cgi-bin/ {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        # login.cgi ставит cookie с флагом Secure только при HTTPS
        fastcgi_param  HTTPS           $https;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout    20s;
        fastcgi_read_timeout    20s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }

    # ── Внутренняя проверка авторизации для API flasher ─────────────────────
    location = /_auth_check {
        internal;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root/cgi-bin/auth_check.cgi;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout    20s;
        fastcgi_read_timeout    20s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }

    # ── Flasher API (демон sa02m-flasher, unix-socket) ──────────────────────
    # SSE-эндпоинт вынесен отдельно: отключаем буферизацию и увеличиваем таймаут чтения.
    # Важно: rewrite ... break должен отработать ДО proxy_pass (proxy_pass без URI — берёт $uri).
    location ~ ^/api/flasher/jobs/[^/]+/events$ {
        auth_request /_auth_check;
        rewrite ^/api/flasher(/.*)$ $1 break;
        proxy_pass http://unix:/run/sa02m-flasher/flasher.sock;
        proxy_http_version 1.1;
        proxy_set_header   Host          $host;
        proxy_set_header   Cookie        $http_cookie;
        proxy_set_header   X-Real-IP     $remote_addr;
        proxy_set_header   Connection    "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /api/flasher/ {
        auth_request /_auth_check;
        rewrite ^/api/flasher(/.*)$ $1 break;
        proxy_pass http://unix:/run/sa02m-flasher/flasher.sock;
        proxy_http_version 1.1;
        proxy_set_header   Host          $host;
        proxy_set_header   Cookie        $http_cookie;
        proxy_set_header   X-Real-IP     $remote_addr;
        proxy_request_buffering off;
        client_max_body_size 8m;
        proxy_read_timeout 300s;
    }

    # ── SPA fallback (everything → index.html) ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/sa02m_access.log;
    error_log  /var/log/nginx/sa02m_error.log warn;
}

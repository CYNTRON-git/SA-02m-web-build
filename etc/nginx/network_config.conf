# ── Devices API upstream (sa02m-devices-api) ─────────────────────────────
# The daemon's AF_UNIX socket and NOTHING else (0660 root:www-data — any
# www-data process can connect too; the daemon's own session check is what
# holds there). No TCP `backup` on purpose (Operator decision 2026-09-29): the
# daemon frees 127.0.0.1:8765 once THIS file names the socket, and a backup
# would hand the panel's session cookie and CSRF token to whatever local
# process bound that free port whenever the socket leg failed (a restart, an
# OTA, a crash, an operator stop). Bench 1.135 binds its stand gunicorn to the
# same socket (docs/bench-board-target-state.md). The daemon's
# STAND_API_TCP_COMPAT=auto sniffs the live site file for the exact `unix:`
# string below — keep it verbatim. Legal here: the site file is included in the
# http context. Gate: devices-api-upstream.
upstream sa02m_devices_api {
    server unix:/run/sa02m-devices/api.sock;
}

# ── CSRF gate of the vPLC page route (location ^~ /vplc/ below) ───────────
# 1 = a request other than GET/HEAD that carries no X-SA02M-CSRF header.
# The vPLC server authenticates nobody, so the panel session alone would let
# a page on the board's own IP at another port (Node-RED :1880 and the like)
# POST to /vplc/ as the operator: that page is same-site, and SameSite=Lax
# does not stop it (docs/decisions/selective-csrf-policy.md, «Демоны»). The
# header's PRESENCE is the defence on its own: a cross-origin page can only
# send a custom header after a CORS preflight, and that preflight (OPTIONS,
# no such header, no cookie) is refused right here with 403 - the panel
# origin grants no CORS.
# Seam condition: the vPLC page sends X-SA02M-CSRF = the same-origin-readable
# sa02m_csrf cookie on every non-GET request. An allow-list of the safe
# methods, not a list of the mutating ones: a method nobody listed is gated
# too. Regex keys are tried in order; any other method WITH the header
# matches neither and takes the default 0.
map "$request_method:$http_x_sa02m_csrf" $vplc_csrf_bad {
    default          0;
    "~^(GET|HEAD):"  0;
    "~^[^:]+:$"      1;
}

server {
    # default_server — при втором vhost на том же порту отвечает этот блок (иначе 403 из «чужого» root)
    listen __PORT__ default_server;
    server_name _;
    root __WEB_ROOT__;
    index index.html;

    charset utf-8;

    # ── Static assets (CSS, JS, images) ────────────────────────────────────
    location /static/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ── Login page (no auth) ────────────────────────────────────────────────
    location = /login.html { try_files $uri =404; }

    # Старые закладки /cgi-bin/index.cgi — без fcgiwrap (устраняет 403 если файла нет или не +x)
    location = /cgi-bin/index.cgi {
        return 302 /;
    }

    # ── CGI backend ─────────────────────────────────────────────────────────
    # Долгая диагностика (i2cdetect, journalctl, много секций) — общий таймаут 20s обрывает ответ.
    location = /cgi-bin/ssh_debug.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    120s;
        fastcgi_read_timeout    120s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # web_update_check.cgi?force=1: git ls-remote + GitHub API до ~36s → общий 20s даёт 504.
    location = /cgi-bin/web_update_check.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # Offline .sa02m upload — stream body to CGI (plan §2.8); 128m cap.
    location = /cgi-bin/web_update_upload.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        client_max_body_size       128m;
        client_body_buffer_size    128k;
        fastcgi_request_buffering  off;
        gzip                       off;
        fastcgi_connect_timeout    5s;
        fastcgi_send_timeout       600s;
        fastcgi_read_timeout       600s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # MPLC4 project upload+deploy — multipart .zip (real export ~14 KB, cap 5 MB
    # in the CGI); the POST returns `pending` immediately and the deploy runs in
    # the background, so the response is fast but the body needs a raised cap.
    location = /cgi-bin/mplc_project_deploy.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        client_max_body_size       8m;
        client_body_buffer_size    128k;
        fastcgi_connect_timeout    5s;
        fastcgi_send_timeout       120s;
        fastcgi_read_timeout       120s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # Downloadable backup stream — no buffering (plan §3.1).
    location = /cgi-bin/web_backup.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        gzip                       off;
        fastcgi_buffering          off;
        add_header Cache-Control "no-store" always;
        fastcgi_connect_timeout    5s;
        fastcgi_send_timeout       300s;
        fastcgi_read_timeout       300s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # Offline apply/cancel — allow longer start/stop of sa02m-update.service.
    location = /cgi-bin/web_update_apply.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    location = /cgi-bin/web_update_cancel.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # services_ctrl.cgi GET: list опрашивает systemd по каждой службе; при параллельном stop/start
    # (CODESYS и др.) systemctl может отвечать >20s → 504 во время poll в UI.
    location = /cgi-bin/services_ctrl.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    120s;
        fastcgi_read_timeout    120s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # apply.cgi: timedatectl/hwclock при сбое dbus могут не отвечать дольше общего 20s → 504.
    location = /cgi-bin/apply.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout    120s;
        fastcgi_read_timeout    120s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # mqtt_monitor.cgi: SSE stream — buffering off, long timeout required
    location = /cgi-bin/mqtt_monitor.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout    300s;
        fastcgi_read_timeout    300s;
        fastcgi_buffering       off;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }
    # mqtt_scan.cgi: one NDJSON line per device while the sweep is still
    # running. The prefix location buffers until the script exits (and its
    # 20s read timeout is shorter than a quiet gateway range), so rows would
    # land in one batch or the request would 504.
    location = /cgi-bin/mqtt_scan.cgi {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        gzip                       off;
        fastcgi_buffering          off;
        fastcgi_connect_timeout    5s;
        fastcgi_send_timeout       180s;
        fastcgi_read_timeout       180s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }

    # include первым: дистрибутивный fastcgi_params не должен перетирать наши значения «сверху»
    location /cgi-bin/ {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout    20s;
        fastcgi_read_timeout    20s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }

    # ── Внутренняя проверка авторизации для API flasher ─────────────────────
    location = /_auth_check {
        internal;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root/cgi-bin/auth_check.cgi;
        fastcgi_param  HTTP_COOKIE     $http_cookie;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout    20s;
        fastcgi_read_timeout    20s;
        fastcgi_pass   unix:/run/fcgiwrap/fcgiwrap.socket;
    }

    # ── Flasher API (демон sa02m-flasher, unix-socket) ──────────────────────
    # SSE-эндпоинт вынесен отдельно: отключаем буферизацию и увеличиваем таймаут чтения.
    # Важно: rewrite ... break должен отработать ДО proxy_pass (proxy_pass без URI — берёт $uri).
    location ~ ^/api/flasher/jobs/[^/]+/events$ {
        auth_request /_auth_check;
        rewrite ^/api/flasher(/.*)$ $1 break;
        proxy_pass http://unix:/run/sa02m-flasher/flasher.sock;
        proxy_http_version 1.1;
        proxy_set_header   Host          $host;
        proxy_set_header   Cookie        $http_cookie;
        proxy_set_header   X-Real-IP     $remote_addr;
        # X-SA02M-Auth is the nginx<->daemon INTERNAL_TOKEN seam (sa02m_flasher.conf):
        # a value the EDGE would attach, never a client credential. nginx forwards
        # every header it does not override, so overwrite it with "" (nginx drops
        # an empty header) - a browser- or cloud-supplied value never reaches the
        # daemon. Gate: flasher-auth-header-strip. Set it from an nginx-held file
        # only if nginx itself becomes the sender; never from $http_x_sa02m_auth.
        proxy_set_header   X-SA02M-Auth  "";
        proxy_set_header   Connection    "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /api/flasher/ {
        auth_request /_auth_check;
        rewrite ^/api/flasher(/.*)$ $1 break;
        proxy_pass http://unix:/run/sa02m-flasher/flasher.sock;
        proxy_http_version 1.1;
        proxy_set_header   Host          $host;
        proxy_set_header   Cookie        $http_cookie;
        proxy_set_header   X-Real-IP     $remote_addr;
        # X-SA02M-Auth is the nginx<->daemon INTERNAL_TOKEN seam (sa02m_flasher.conf):
        # a value the EDGE would attach, never a client credential. nginx forwards
        # every header it does not override, so overwrite it with "" (nginx drops
        # an empty header) - a browser- or cloud-supplied value never reaches the
        # daemon. Gate: flasher-auth-header-strip. Set it from an nginx-held file
        # only if nginx itself becomes the sender; never from $http_x_sa02m_auth.
        proxy_set_header   X-SA02M-Auth  "";
        proxy_request_buffering off;
        client_max_body_size 8m;
        proxy_read_timeout 300s;
    }


    # ── Devices live/history (sa02m-devices-api; stand 1.135: its gunicorn on the same socket) ──
    # auth_request stays as defence in depth: since 1.0.6.65 the daemon checks
    # the panel session (and X-SA02M-CSRF on POST) itself.
    location = /api/devices {
        auth_request /_auth_check;
        proxy_pass http://sa02m_devices_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location /api/devices/ {
        auth_request /_auth_check;
        proxy_pass http://sa02m_devices_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        # 7д/30д + group=energy/climate — несколько SQL, до 120 с
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Agent API (REST + MCP). The daemon authenticates the token; nginx does not
    # run auth_request here. SSE needs buffering off and a long read timeout.
    # This location ships with the site file, not with GitHub-OTA alone.
    location /api/v1/ {
        client_max_body_size 8m;
        proxy_pass http://unix:/run/sa02m-agent-api/api.sock:;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-SA02M-Token $http_x_sa02m_token;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-SA02M-CSRF $http_x_sa02m_csrf;
        proxy_set_header X-SA02M-Auth "";
    }

    location = /health {
        proxy_pass http://unix:/run/sa02m-agent-api/api.sock:;
        proxy_set_header X-SA02M-Auth "";
    }

    location = /mcp {
        client_max_body_size 8m;
        proxy_pass http://unix:/run/sa02m-agent-api/api.sock:;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-SA02M-Token $http_x_sa02m_token;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-SA02M-Auth "";
    }

    location = /llms.txt {
        try_files /llms.txt =404;
    }

    # ── vPLC page (vplc-plant-ui.service, unix:/run/vplc-plant-ui/ui.sock) ──
    # Mounted on the panel's own origin so the page's fetch of
    # api/devices/history… carries the panel cookie straight to the
    # /api/devices/ location above. The vPLC server authenticates nobody: the
    # panel session is checked HERE, and the Cookie header is dropped before the
    # request leaves nginx, so the panel session never reaches another local
    # process. The URI part `:/` of proxy_pass cuts the /vplc prefix (the vPLC
    # server sees paths without it); X-Forwarded-Prefix tells the page where it
    # is mounted. Prefix, header names, the Cookie drop and the socket path are
    # agreed with the vPLC side - do not change them alone. ^~ keeps any regex
    # location from claiming a /vplc/... path. Long read timeout + no
    # buffering: the page streams the runtime's SSE. No socket -> nginx 502,
    # the normal "vPLC not running" answer. A unix socket, not a TCP port
    # (Operator decision 2026-10-07; layout confirmed by the vPLC side): the
    # unit runs User=root Group=www-data with RuntimeDirectory=vplc-plant-ui
    # and RuntimeDirectoryMode=0750, so /run/vplc-plant-ui is root:www-data
    # 0750; the root process removes any old file, binds ui.sock, then
    # chowns it root:www-data and chmods it 0660 (NoNewPrivileges,
    # ProtectSystem=full, PrivateTmp; Restart=on-failure after 5 s), and
    # systemd removes the directory when the unit stops. Group www-data
    # (nginx, status.cgi) can traverse the directory and connect to the
    # socket but cannot create a file in it, and /run itself is root-only, so
    # only root can put a listener at this path - no local process can squat
    # the route while the unit is down, as any could on a free 127.0.0.1 port.
    # CSRF: see $vplc_csrf_bad at the top of this file.
    # Both redirects are RELATIVE (the panel's own idiom: app.js sends
    # 'login.html'), so the cloud path /devcfg/<id>/vplc/ resolves under its own
    # prefix (docs/contracts/cloud-panel-proxy.md §1, «Относительные пути»).
    location = /vplc {
        return 301 vplc/;
    }
    location ^~ /vplc/ {
        auth_request /_auth_check;
        error_page 401 = @vplc_login;
        # A non-GET/HEAD request without X-SA02M-CSRF never reaches the vPLC
        # server. `return` inside `if` is the one `if` form that is safe in a
        # location (no other directive under it); it runs at the rewrite
        # phase, before auth_request.
        if ($vplc_csrf_bad) {
            return 403;
        }
        proxy_pass http://unix:/run/vplc-plant-ui/ui.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Prefix /vplc;
        proxy_set_header Cookie "";
        # Nor may the upstream set cookies on the panel's origin (it could
        # otherwise plant or shadow session_token/sa02m_csrf): the vPLC page
        # authenticates nobody and needs no cookie of its own.
        # No proxy_cache here, so proxy_ignore_headers is not needed.
        proxy_hide_header Set-Cookie;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 2s;
    }
    # From /vplc/ this lands on login.html at the panel root; from a deeper
    # /vplc/a/b it walks up one level per hop (each hop is again unauthenticated)
    # until it reaches the panel's login.html.
    location @vplc_login {
        return 302 ../login.html;
    }

    # ── SPA fallback (everything → index.html) ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/sa02m_access.log;
    error_log  /var/log/nginx/sa02m_error.log warn;
}

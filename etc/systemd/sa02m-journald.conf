# SA-02m journald policy
# ─────────────────────────────────────────────────────────────────────────────
# Drop-in для /etc/systemd/journald.conf — устанавливается в
# /etc/systemd/journald.conf.d/sa02m-journald.conf (тот же приём, что и
# etc/systemd/sa02m-watchdog.conf). Drop-in, а не правка journald.conf:
# он не воюет с файлом базового образа, переживает его обновление и видно, что
# он наш.
#
# Единственный дом политики журнала — этот файл.
#
# ЧЕСТНО: до этой версии предел журнала репозиторием НЕ владелся вообще. На
# стендовой плате он держится только потому, что его задал базовый образ. Здесь
# он становится нашим, а не унаследованным.
#
# SystemMaxUse=20M
#   Решение оператора. Строже 100M и совпадает с тем, что уже стоит на парке
#   плат. Верхняя граница /var/log/journal на eMMC.
#
# Compress=yes
#   Текстовые логи жмутся примерно в 10 раз — тот же предел вмещает на порядок
#   больше истории. Цена — немного CPU на запись, на A40i незаметно.
#
# Storage=persistent
#   Журнал переживает перезагрузку. `journalctl -b -1` — штатный приём разбора
#   полётов в этом проекте (docs/bugs/BUGLOG.md), а на volatile-журнале он
#   бесполезен. Цена — запись на eMMC, ограниченная теми же 20M плюс сжатие.
#
# RuntimeMaxUse=16M
#   /run/log/journal — это tmpfs, то есть ОЗУ на плате с 1 ГБ; умолчание — 10%
#   tmpfs. Дешёвая граница.
#
# SystemMaxFileSize — НАМЕРЕННО не задаём. Производное умолчание —
#   SystemMaxUse/8 = 2.5M, то есть ~8 слотов ротации: этого достаточно. Явное
#   значение — вторая ручка на одну политику, ровно так разъехалась пара
#   RebootWatchdogSec/ShutdownWatchdogSec (см. sa02m-watchdog.conf).
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=20M
RuntimeMaxUse=16M

# SA-02m journald policy
# ─────────────────────────────────────────────────────────────────────────────
# Drop-in for /etc/systemd/journald.conf, installed as
# /etc/systemd/journald.conf.d/sa02m-journald.conf by scripts/01-system.sh (the
# same pattern as etc/systemd/sa02m-watchdog.conf). A drop-in, not an edit of
# journald.conf: it does not fight the base image's file, survives its upgrade,
# and is visibly ours.
#
# This file is the one home of the journal policy.
#
# Storage=persistent
#   The journal survives a reboot: `journalctl -b -1` is this project's standard
#   post-mortem tool (docs/bugs/BUGLOG.md), useless on a volatile journal.
#   HOLDS ONLY WITH THE ARMBIAN RAM-LOG HOOKS OFF: their 15-min cron runs
#   `journalctl --relinquish-var`, which moved the journal back to /run (RAM)
#   until the nightly flush, whatever this line says (bench 1.135, 2026-09-23).
#   The hooks are switched off by the repo-owned etc/default/armbian-ramlog.
#
# SyncIntervalSec=1m
#   How often journald fsyncs the journal to disk. A power cut loses at most
#   the last minute of entries (the default is 5 min). Entries of priority
#   CRIT, ALERT and EMERG are synced at once regardless (journald.conf(5)).
#
# Compress=yes
#   Compresses only data objects larger than 512 bytes (journald.conf(5)), so
#   ordinary short lines are stored uncompressed: measured on 1.135, 28,383
#   entries took 17.5 MB, ~620 B per entry. It helps long lines (tracebacks,
#   JSON dumps) only.
#
# SystemMaxUse=20M
#   Operator decision: the upper bound of /var/log/journal on the eMMC.
#   Retention is a measurement, not a promise: under 1.135's September noise
#   (~6,800 entries/h) 20M holds roughly 5 hours; a quiet board holds days.
#
# RuntimeMaxUse=16M
#   /run/log/journal is tmpfs, i.e. RAM on a small board; the default is 10 %
#   of the tmpfs. A cheap bound.
#
# SystemMaxFileSize — deliberately NOT set. The derived default is
#   SystemMaxUse/8 = 2.5M, i.e. ~8 rotation slots, which is enough. An explicit
#   value is a second knob on one policy — exactly how the
#   RebootWatchdogSec/ShutdownWatchdogSec pair drifted apart (see
#   sa02m-watchdog.conf).
[Journal]
Storage=persistent
SyncIntervalSec=1m
Compress=yes
SystemMaxUse=20M
RuntimeMaxUse=16M

# SA-02m: bounded PHY-carrier wait before `ifup -a`.
#
# The ifup@ drop-in alone is not enough: networking.service can start its own
# `ifup -a` WHILE that pre-step is still waiting (the pre-step holds no
# ifupdown lock), configure the interface too early itself, fail on the gateway
# and hand the duplicate right back. With the wait on both paths, whichever
# runs first succeeds and the second finds the interface already recorded in
# /run/network/ifstate and skips it.
# Contract: docs/contracts/boot-network-dns.md
#
# --auto = the `auto` static interfaces that declare a gateway, sharing ONE
# budget. `-` prefix AND an unconditional exit 0 in the helper: never fails the
# unit, never blocks the network. networking.service's TimeoutStartUSec is
# 5 min; the helper's hard clamp is 120 s.
[Service]
ExecStartPre=-/usr/local/sbin/sa02m-wait-carrier.sh --auto

# SA-02m: nginx restarts itself after a crash (audit 2026-11-11 A3-06).
#
# Stock nginx.service has no Restart=: one crash left the panel down until the
# userspace watchdog rebooted the whole board ten minutes later. on-failure,
# not always: a deliberate `systemctl stop nginx` stays stopped.
# RestartSec=5: a broken config (nginx exits at once) is retried at most every
# 5 s instead of spinning; StartLimitIntervalSec=0 keeps it retrying instead of
# parking the unit `failed` after five quick crashes — the watchdog restarts it
# too (etc/sa02m-userspace-watchdog.sh) before it ever reboots.
# Installed by scripts/03-webserver.sh (full install / --refresh only; OTA and
# the offline pack do not carry units outside sa02m-* — docs/deployment.md).
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5

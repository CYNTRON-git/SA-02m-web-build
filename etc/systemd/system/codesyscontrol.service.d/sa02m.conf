# ═══════════════════════════════════════════════════════════════════════════
# SA-02m drop-in для codesyscontrol.service
#
# Причина: unit codesyscontrol.service генерируется systemd-sysv-generator из
# LSB-скрипта /etc/init.d/codesyscontrol и имеет RemainAfterExit=yes,
# GuessMainPID=no, Restart=no. LSB-обёртка запускает codesyscontrol.bin в
# фоне, возвращается сразу, и systemd больше НЕ следит за реальным демоном.
# Когда demo-режим CODESYS истекает через ~2 часа, codesyscontrol.bin
# выполняет clean shutdown — но systemd продолжает считать сервис «active
# (exited)», реальный демон при этом уже мёртв. Веб-панель СА-02м измеряет
# uptime по PID codesyscontrol.bin (proc_uptime_seconds_by_name) — после
# ручного restart из панели показывает свежий uptime <60 сек, что выглядит
# как restart-loop.
#
# Что делает этот drop-in:
#   1. Заставляет systemd следить за реальным PID демона через pidfile
#      /var/run/codesyscontrol.pid (его создаёт LSB-скрипт при старте).
#   2. Переводит сервис в inactive, когда демон реально умирает
#      (RemainAfterExit=no + GuessMainPID=yes).
#   3. Не рестартует при штатном выходе (например, demo-mode expiry) —
#      Restart=on-failure + SuccessExitStatus=0 5 6. Если codesys упадёт
#      аварийно (SIGSEGV / OOM), systemd подождёт 30 минут и попробует
#      снова — тайминг подобран так, чтобы не устраивать restart-loop, если
#      корневая причина в отсутствии лицензии.
#
# Активация лицензии Standard S — ручное действие оператора через CODESYS
# Development System (ticket в docs/codesys-rt/README.md); после активации
# .wbc падает в /var/opt/codesys/ и demo-режим больше не срабатывает.
# ═══════════════════════════════════════════════════════════════════════════

[Service]
PIDFile=/var/run/codesyscontrol.pid
GuessMainPID=yes
RemainAfterExit=no

Restart=on-failure
RestartSec=1800
SuccessExitStatus=0 5 6

TimeoutStartSec=180
TimeoutStopSec=60

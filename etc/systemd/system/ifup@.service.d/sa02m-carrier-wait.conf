# SA-02m: bounded PHY-carrier wait before the hotplug-triggered ifup.
#
# The canonical rename's uevent makes /lib/udev/ifupdown-hotplug start
# ifup@eth0 before the PHY has negotiated; the static method's gateway step
# then fails, ifup aborts before its if-up.d stage and 000resolvconf never
# runs -> empty /etc/resolv.conf. Waiting for carrier==1 removes that.
# Contract: docs/contracts/boot-network-dns.md
#
# `-` prefix AND an unconditional exit 0 in the helper: this can never fail
# the unit. Budget: IFUP_CARRIER_WAIT_SECS in /etc/sa02m_network.conf,
# default 10 s, 0 disables, hard-clamped at 120 s by the helper — ifup@'s own
# TimeoutStartUSec is 5 min, so the wait cannot reach it.
[Service]
ExecStartPre=-/usr/local/sbin/sa02m-wait-carrier.sh %I

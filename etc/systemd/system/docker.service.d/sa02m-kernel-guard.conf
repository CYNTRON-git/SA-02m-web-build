# SA-02m: start docker only on a kernel whose netfilter set supports docker's
# iptables-nft path (capability probe — nft_compat module or builtin), never
# by kernel-name matching: a future docker-capable SMP kernel must pass with
# no code change. On an incapable kernel the unit is SKIPPED cleanly
# (inactive, condition-style, never `failed`, no 3x restart burst); on a
# capable kernel docker starts normally. Requires systemd >= 243
# (ExecCondition) — Armbian Noble ships 25x.
# Contract: docs/contracts/kernel-conditional-services.md
[Service]
ExecCondition=/usr/local/sbin/sa02m-kernel-service-guard.sh docker-capable

# Installed by scripts/11-devices.sh only when sa02m-stand-api.service is
# already on the board. Gunicorn loads stand_socket_group.py after its own
# CLI (no --config there), and when_ready puts the devices socket in group
# www-data. A timed ExecStartPost is not this job: on 1.135 a cold import
# created the socket at 19s and a 10s wait left it root:root.
[Service]
# No space: systemd Environment= splits an unquoted value on whitespace, so
# "--config /path" becomes a bare --config and gunicorn exits 2.
Environment=GUNICORN_CMD_ARGS=--config=/opt/sa02m-devices/sa02m_devices/stand_socket_group.py

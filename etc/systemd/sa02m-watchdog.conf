# SA-02m hardware watchdog policy
# ─────────────────────────────────────────────────────────────────────────────
# Drop-in для /etc/systemd/system.conf — устанавливается в
# /etc/systemd/system.conf.d/sa02m-watchdog.conf
#
# RuntimeWatchdogSec=25s
#   PID1 systemd сам открывает /dev/watchdog и пингует его раз в ~8 c.
#   Sunxi A40i watchdog caps at 16s hardware — systemd адаптируется к
#   реальному значению (журнал: "Watchdog running with a timeout of 16s").
#   16s даёт udev-скрипту sa02m-i2c2-unbind.sh ≥7 с запаса для отвязки
#   i2c-2 до срабатывания таймера (udev срабатывает ~8–9 с после старта).
#
# RebootWatchdogSec=2min
#   Если systemctl reboot завис, kernel WDT перезагрузит плату через 2 мин.
#
# Эти настройки делают пользовательский bash-watchdog-feeder ненужным:
# его старая реализация открывала /dev/watchdog в цикле, забивая journald
# спамом "watchdog: watchdog0: watchdog did not stop!".
[Manager]
RuntimeWatchdogSec=25s
RebootWatchdogSec=2min

# ═══════════════════════════════════════════════════════════════════════════
# СА-02м  •  Hardware Configuration
# По умолчанию используется PCA9536 по I2C. Если нужны старые sysfs GPIO,
# задайте SA02M_HW_BACKEND=gpio_sysfs и заполните SA02M_GPIO_*.
# ═══════════════════════════════════════════════════════════════════════════

# Backend: auto | i2c_expander | gpio_sysfs | disabled
# По умолчанию — i2c_expander (PCA9536 на bus 2 addr 0x41): плата СА-02м
# всегда несёт PCA9536, а web-панель раздела "Дискретный выход, USB-питание
# и индикация" завязана на его каналы (do / beeper / alarm_led). Значение
# `disabled` оставляет кнопки в UI навсегда «Н/Д» и disabled — используйте
# его только для отладки без доступа к I2C.
# Для рискованного переключения backend с автооткатом:
# /usr/local/sbin/sa02m-hw-backend-guard activate auto 120 disabled
SA02M_HW_BACKEND=i2c_expander

# PCA9536 на шине I2C
SA02M_I2C_EXP_BUS=2
SA02M_I2C_EXP_ADDR=0x41
SA02M_I2C_LOCK_FILE=/run/lock/sa02m-pca9536.lock
SA02M_I2C_LOCK_WAIT_SEC=1
SA02M_I2C_TIMEOUT_SEC=1
SA02M_I2C_OWNER_UNITS="mplc.service mplc4.service klogic.service klogicd.service"
SA02M_I2C_OWNER_PROCS="mplc mplc4 klogic klogicd klogic-sa02"
SA02M_I2C_RESPECT_OWNER=1
SA02M_BEEPER_WEB_OVERRIDE_SEC=7
SA02M_BEEPER_OVERRIDE_FILE=/run/sa02m-hw-override/beeper.env
SA02M_BEEPER_OVERRIDE_WORKER=/usr/local/sbin/sa02m-beeper-override.sh

# auto = все объявленные каналы считаются active-low
SA02M_I2C_ACTIVE_LOW_MASK=auto

# Реальное соответствие для драйвера MPLC:
# bit0 = Red/Alarm LED, bit1 = DO, bit2 = Buzzer, bit3 = Blue LED.
# USB_POWER не находится на PCA9536, а управляется отдельной GPIO.
# bit3 не управляется web UI, но должен оставаться output для мигания KLogic.
SA02M_I2C_EXTRA_OUTPUT_MASK=0x08
SA02M_I2C_BIT_DO=1
SA02M_I2C_BIT_BEEPER=2
SA02M_I2C_BIT_ALARM_LED=0
SA02M_I2C_BIT_USB_POWER=

# Fallback для sysfs GPIO (используется только при SA02M_HW_BACKEND=gpio_sysfs
# или если в режиме auto заданы эти линии, а I2C-конфиг не нужен).
SA02M_GPIO_DO=
SA02M_GPIO_BEEPER=
SA02M_GPIO_ALARM_LED=
SA02M_GPIO_USB_POWER=
# Питание USB через libgpiod (как gpioset 0 268=1). Очистите LINE, если не используется.
# 0 — gpio 1 на линии 268 = питание USB включено (как sa02m-pre-start / gpioset 0 268=1).
# 1 — инверсия смысла в UI при опросе; запись учитывается в sa02m_hw_usb_logical_to_raw_line.
SA02M_USB_POWER_INVERT=0
SA02M_GPIO_USB_GPIOD_CHIP=0
SA02M_GPIO_USB_GPIOD_LINE=268

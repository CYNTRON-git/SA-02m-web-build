# ═══════════════════════════════════════════════════════════════════════════
# /etc/sa02m_network.conf  —  Настройки сетевого watchdog СА-02м
# Этот файл опционален. Раскомментируйте нужные строки.
# ═══════════════════════════════════════════════════════════════════════════

# Интервал проверки интерфейсов (секунды, по умолчанию 30)
# WATCHDOG_INTERVAL=30

# Cooldown между попытками восстановления одного интерфейса (секунды)
# RECOVER_COOLDOWN=60

# ── Пинг-цели для проверки связности ─────────────────────────────────────
#
# Если у интерфейса в interfaces.d задан gateway, fix-eth использует его как
# fallback-цель только после того, как этот gateway хотя бы один раз успешно
# ответил. Это защищает isolated-LAN от ложных ifdown/ifup, когда gateway
# указан "формально", но реально недоступен.
#
# Эти переменные позволяют задать другую цель или отключить пинг:
#
#   WATCHDOG_PING_<IFACE>=<IP>    — пинговать этот IP вместо шлюза
#   WATCHDOG_PING_<IFACE>=skip    — пропустить пинг для этого интерфейса
#
# <IFACE> — это ЖИВОЕ имя интерфейса в верхнем регистре (fix-eth.sh выводит имя
# переменной из него), то есть ETH0/ETH1 на канонически именованной плате.
#
# Примеры:
#   eth0 — основная сеть с реальным маршрутизатором
# WATCHDOG_PING_ETH0=192.168.1.1

#   eth0 — локальная сеть / прямое подключение без гарантированно доступного gateway
# WATCHDOG_PING_ETH0=skip

#   eth1 — локальная сеть без шлюза, пинговать конкретное устройство
# WATCHDOG_PING_ETH1=10.0.0.2

#   eth1 — только carrier+IP, не пинговать вообще
# WATCHDOG_PING_ETH1=skip

# ── Канонические имена интерфейсов ───────────────────────────────────────
#
# sa02m-iface-canonical.service переименовывает end0/end1 → eth0/eth1 при
# каждой загрузке. Сколько секунд ждать появления интерфейса в /sys/class/net,
# прежде чем считать его отсутствующим (по умолчанию 10):
# IFACE_CANONICAL_WAIT_SECS=10

# ── Ожидание линка (carrier) перед ifup ──────────────────────────────────
#
# На холодном старте ifup@ethX может запуститься раньше, чем PHY согласовал
# линк: тогда шаг gateway падает («Nexthop device is not up»), ifup обрывается
# ДО хуков if-up.d, /etc/resolv.conf остаётся пустым — плата пингуется, но
# ничего не резолвит. sa02m-wait-carrier.sh ждёт carrier=1 перед ifup
# (ExecStartPre в drop-in'ах ifup@.service и networking.service).
#
# Бюджет ожидания в секундах (по умолчанию 10, 0 — выключить ожидание):
# IFUP_CARRIER_WAIT_SECS=10
#
# Бюджет ОБЩИЙ на все интерфейсы за один запуск и жёстко ограничен 120 с в
# самом скрипте: TimeoutStartUSec у ifup@ и networking — 5 минут, и ожидание
# не должно к нему приближаться, иначе поздний линк превращается в FAILED-юнит
# (ровно та поломка, которую это лечит). Значение больше 120 будет обрезано с
# записью в журнал. Реальную длительность ожидания каждой загрузки смотрите:
#   journalctl -b -t sa02m-wait-carrier

# ── Inet-failover (переключение маршрутов по наличию интернета) ──────────
#
# По умолчанию inet-failover.sh проверяет наличие интернета через каждый
# интерфейс (curl к connectivitycheck.gstatic.com). На устройствах без
# интернета (isolated LAN, прямое подключение) это бесполезно и тратит
# ~8 сек CPU каждые 30 сек на curl-таймауты + деградирует default-маршрут
# до metric=300.
#
# Для LAN-only устройств раскомментируйте строку ниже:
# INET_FAILOVER_ENABLED=no

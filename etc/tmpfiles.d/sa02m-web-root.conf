# SA-02m served web tree: root:root at every boot, read-only to www-data.
# Nothing the web does at runtime writes under the web root (every CGI keeps its
# state in /run, /tmp or /var/lib), so no subpath is left www-data-writable.
#
# The install/update-time migration is the sa02m-web-root-own block
# (scripts/lib.sh, etc/sa02m-web-update-apply.sh, etc/sa02m-update-runner.sh):
# it also removes planted links and normalises modes. This line is the boot-time
# belt, for one case the block cannot reach: the FIRST update that carries it is
# applied by the board's previous runner (the runner re-execs a copy of the
# INSTALLED binary), which leaves the tree www-data-owned. The conf rides that
# same update (map_dst / offline package: etc/tmpfiles.d/*) and systemd-tmpfiles
# re-owns the tree at the next boot.
#
# Z = recursive, ownership only (mode "-": not changed). systemd-tmpfiles walks by
# fd and never follows a symlink (a link itself is re-owned, its target is not).
Z /var/www/network_config - root root -

# SA-02m Alice state dirs.
# The enroll write (device.key.pem / device.crt.pem / pending_claim.json) runs
# as www-data inside sa02m_alice_api.cgi, so the state dir must be www-data-
# writable; on a fresh rootfs first boot must create it. cleanup-donor.sh does
# NOT touch this tree — it is in that script's DENY list on purpose; the image
# identity clear (tools/imaging/stream-after-cleanup.sh, patch-firstboot-image.sh
# — docs/contracts/image-identity-reset.md) removes the identity FILES and
# leaves the dir. systemd-tmpfiles also re-asserts owner/mode on existing dirs
# every boot — the idempotent migration for in-place upgrades.
d /var/lib/sa02m-alice 0700 www-data www-data -
d /run/sa02m-alice 0755 root root -
# Conf dir needs group write: the CGI (www-data) saves client/devices confs
# atomically (tmp file + rename), which requires write on the directory.
d /etc/sa02m-alice 0770 root www-data -

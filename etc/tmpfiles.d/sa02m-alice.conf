# SA-02m Alice state dirs.
# The enroll write (device.key.pem / device.crt.pem / pending_claim.json) runs
# as www-data inside sa02m_alice_api.cgi, so the state dir must be www-data-
# writable; donor image cleanup (tools/imaging/cleanup-donor.sh) wipes the dir,
# so first boot must recreate it. systemd-tmpfiles also re-asserts owner/mode
# on existing dirs every boot — the idempotent migration for in-place upgrades.
d /var/lib/sa02m-alice 0700 www-data www-data -
d /run/sa02m-alice 0755 root root -
# Conf dir needs group write: the CGI (www-data) saves client/devices confs
# atomically (tmp file + rename), which requires write on the directory.
d /etc/sa02m-alice 0770 root www-data -

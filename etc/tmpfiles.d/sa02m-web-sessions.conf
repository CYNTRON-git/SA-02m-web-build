# Runtime-каталоги веб-интерфейса SA-02м (tmpfs, пересоздаются при загрузке).
#   sa02m-web-sessions — серверные сессии (файлы sha256(token); создаёт login.cgi).
#   sa02m-web-login    — счётчики неудачных входов по IP (rate-limit).
# setgid (2750): файлы наследуют группу www-data; демон sa02m-flasher (в группе
# www-data) читает сессии read-only. Токен в файлах не хранится.
d /run/sa02m-web-sessions 2750 www-data www-data -
d /run/sa02m-web-login    2750 www-data www-data -

# Shared PCA9536 I2C flock (/run/lock/sa02m-pca9536.lock).
# root (telemetry, stand, beeper) and www-data (CGI, lib_hw.sh) must both
# flock this file. 0666, not 0660: /run/lock is sticky, and bash `exec 9>`
# (O_CREAT) cannot open a foreign-owned file there — lib_hw.sh opens RDWR.
#
# Own file rather than a line in the installer-generated
# /etc/tmpfiles.d/sa02m.conf: a COMMITTED etc/tmpfiles.d/ file is the only
# form that rides map_dst to an already-installed board (OTA + offline
# package). A second declaration of this path makes systemd-tmpfiles warn,
# so the installer heredoc does not repeat it.
#
# The daemon still creates the file 0666 if it is missing (a board that has
# not rebooted since the conf arrived). Fail-closed «bus busy» if another
# uid holds the flock is unchanged since 1.0.6.42.
f /run/lock/sa02m-pca9536.lock 0666 root www-data -

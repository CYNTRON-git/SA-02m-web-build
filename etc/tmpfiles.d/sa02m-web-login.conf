# SA-02m panel login-throttle state dir.
# web_login_check / web_login_record_failure (www/network_config/cgi-bin/
# lib_web_auth.sh) keep one small per-client counter file in here. The CGI runs
# as www-data and /run is root-owned 0755, so www-data CANNOT create this dir
# itself: without this line web_login__ensure_dir fails, every caller takes its
# fail-OPEN branch, and the brute-force lockout the threat model claims (A1->S2)
# does not exist on the board. That is exactly how it shipped inert in the first
# 1.0.6.24 round (security review F1) — the dir is provisioned here, not lazily.
#
# Own file rather than a line in the installer-generated /etc/tmpfiles.d/
# sa02m.conf: a COMMITTED etc/tmpfiles.d/ file is the only form that rides
# map_dst to an already-installed board (OTA + offline package), so a device
# that only ever updates that way gets the dir with the code that needs it.
#
# 0700 www-data: only the CGI reads or writes it. /run is tmpfs, so the counters
# clear on reboot — deliberate, a lockout is never permanent.
d /run/sa02m-web-login 0700 www-data www-data -

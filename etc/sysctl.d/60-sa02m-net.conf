# SA-02m network tuning
# Send gratuitous ARP when interface link comes up.
# This notifies all LAN hosts of our MAC immediately,
# preventing stale/missing ARP entries after reboot.
# Without this, Windows caches FAILED ARP for ~45-50s, causing ping delay.
net.ipv4.conf.default.arp_notify = 1
net.ipv4.conf.all.arp_notify = 1
net.ipv4.conf.end0.arp_notify = 1

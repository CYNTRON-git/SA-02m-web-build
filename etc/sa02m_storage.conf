# Автоформатирование USB и microSD (mmcblk1/3; на СА-02м eMMC — mmcblk2) в exFAT, если раздел без ФС или NTFS.
# Безопасный дефолт для рабочей платы: 0, чтобы исключить нежелательный mkfs
# до отдельной проверки накопителя.
STORAGE_AUTO_FORMAT=0

# Автозапуск autorun.sh с подключённого USB (выполняется как root). Недоверенный
# носитель = выполнение кода root, поэтому по умолчанию ВЫКЛ. Включайте только
# на доверенном оборудовании (сценарий прошивки приёмника flash-receiver).
STORAGE_ALLOW_AUTORUN=0

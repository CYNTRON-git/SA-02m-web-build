# Профиль serial/RS-485 для конкретной ревизии платы.
# Допустимые значения:
#   SA02M_SERIAL_PROFILE=sa02m-1eth
#   SA02M_SERIAL_PROFILE=sa02m-2eth
#
# Если оставить как есть, installer попытается определить профиль автоматически.
# Для рабочей платы СА-02м (1 Ethernet) зафиксируйте sa02m-1eth.
#
# SA02M_SERIAL_PROFILE=sa02m-1eth

# Polling interval in seconds.
CHECK_INTERVAL=5

# Emit a compact heartbeat line every N seconds.
HEARTBEAT_INTERVAL_SEC=300

# Keep the monitor log bounded.
LOG_ROTATE_MAX_BYTES=2097152
LOG_ROTATE_KEEP_BYTES=1048576

# Services to watch for state changes.
MONITOR_UNITS="ssh nginx fcgiwrap mplc4.service"

# TCP port and local HTTP probes.
# The probe URLs are left unset on purpose: the monitor then probes the panel
# on its real port (/etc/sa02m_web_port.conf). Set them only to pin a URL.
PORT_CHECK=22
#HTTP_PROBE_URL="http://127.0.0.1:9999/login.html"
#STATUS_PROBE_URL="http://127.0.0.1:9999/cgi-bin/status.cgi?part=priority"

{
  "debug": false,
  "num_workers": 4,
  "max_unchanged_interval": 300,

  "mqtt": {
    "host": "localhost",
    "port": 1883,
    "keepalive": 60,
    "client_id": "sa02m-mqtt-snmp",
    "auth": false,
    "username": "",
    "password": ""
  },

  "devices": [
    {
      "enabled": false,
      "id": "snmp-switch-upstairs",
      "name": "Коммутатор этаж 1",
      "address": "192.168.1.200",
      "community": "public",
      "snmp_version": "2c",
      "snmp_timeout": 5,
      "poll_interval": 30000,
      "oid_prefix": "SNMPv2-MIB",
      "channels": [
        {
          "enabled": true,
          "name": "sysName",
          "oid": "sysName.0",
          "control_type": "text",
          "title": {"ru": "Имя устройства", "en": "System Name"}
        },
        {
          "enabled": true,
          "name": "sysUpTime",
          "oid": "sysUpTime.0",
          "control_type": "value",
          "units": "s",
          "scale": 0.01,
          "title": {"ru": "Время работы", "en": "Uptime"}
        },
        {
          "enabled": true,
          "name": "sysLocation",
          "oid": "sysLocation.0",
          "control_type": "text",
          "title": {"ru": "Расположение", "en": "Location"}
        }
      ]
    },
    {
      "enabled": false,
      "id": "snmp-ups-room1",
      "name": "ИБП серверная",
      "address": "192.168.1.201",
      "community": "public",
      "snmp_version": "2c",
      "snmp_timeout": 5,
      "poll_interval": 10000,
      "channels": [
        {
          "enabled": true,
          "name": "battery_pct",
          "oid": ".1.3.6.1.2.1.33.1.2.4.0",
          "control_type": "value",
          "units": "%",
          "title": {"ru": "Заряд батареи", "en": "Battery charge"}
        },
        {
          "enabled": true,
          "name": "input_voltage",
          "oid": ".1.3.6.1.2.1.33.1.3.3.1.3.1",
          "control_type": "voltage",
          "units": "V",
          "scale": 0.1,
          "title": {"ru": "Напряжение на входе", "en": "Input voltage"}
        },
        {
          "enabled": true,
          "name": "output_voltage",
          "oid": ".1.3.6.1.2.1.33.1.4.4.1.2.1",
          "control_type": "voltage",
          "units": "V",
          "scale": 0.1,
          "title": {"ru": "Напряжение на выходе", "en": "Output voltage"}
        },
        {
          "enabled": true,
          "name": "output_load",
          "oid": ".1.3.6.1.2.1.33.1.4.4.1.5.1",
          "control_type": "value",
          "units": "%",
          "title": {"ru": "Нагрузка", "en": "Load"}
        }
      ]
    }
  ]
}

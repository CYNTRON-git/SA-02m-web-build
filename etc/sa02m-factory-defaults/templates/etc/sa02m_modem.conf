# /etc/sa02m_modem.conf — конфигурация USB-модема для СА-02м
#
# Режим подключения:
#   auto    — определяется автоматически (CDC-ethernet → DHCP, ttyUSB → PPP)
#   dhcp    — форсировать DHCP (для CDC-ECM/RNDIS/NCM модемов: eth1, usb0)
#   ppp     — форсировать PPP (для ttyUSB/ttyACM модемов)
#   disabled — не подключаться автоматически
MODEM_MODE=auto

# APN оператора (используется в PPP-режиме)
# Примеры: internet.mts.ru, internet, internet.beeline.ru, internet.tele2.ru
MODEM_APN=internet

# PIN-код SIM (оставьте пустым если PIN не используется)
MODEM_PIN=

# Метрика маршрута по умолчанию через модем (100 = ниже приоритета чем eth0)
MODEM_METRIC=100

# Таймаут DHCP в секундах (режим CDC-ethernet)
MODEM_DHCP_TIMEOUT=30

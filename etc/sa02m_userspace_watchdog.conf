# /etc/sa02m_userspace_watchdog.conf — переопределение sa02m-userspace-watchdog
# FAIL_THRESHOLD × CHECK_INTERVAL = время до forced reboot при стойком сбое.
FAIL_THRESHOLD=60
CHECK_INTERVAL=10
IMAGING_LOCK=/run/sa02m-imaging.lock

# FAIL_THRESHOLD относится к отказам ВСЕЙ платы (нет sshd, порт SSH, интерфейс,
# load, память). Веб-проверки — слой CGI (auth_check.cgi), процесс nginx, порт
# панели, страница входа — только ЛЕЧАТ: после CGI_RESTART_AT подряд неудач
# перезапускается fcgiwrap (для CGI) или nginx (для остальных), затем снова через
# каждые FAIL_THRESHOLD; плата по ним НЕ перезагружается никогда. nginx из
# REQUIRED_PROCS кодом не считается (WEB_PROCS), даже если указан ниже.
# Таймаут пробы CGI (занятый пул) лечится только после CGI_BUSY_RESTART_AT подряд.
# CGI_RESTART_AT=6
# CGI_BUSY_RESTART_AT=90

# Критичные процессы (на плате может быть mplc_daemon):
# REQUIRED_PROCS="mplc_daemon nginx sshd"
